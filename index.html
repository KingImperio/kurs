<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0F0F0F" />
<title>Kurs — Currency Converter</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<main>
  <h1 class="brand">Kurs</h1>

  <section class="card" aria-label="Currency converter">
    <form id="converter" novalidate>
      <div class="row" id="row-from">
        <div class="select-wrap">
          <label class="visually-hidden" for="from-currency">From currency</label>
          <select id="from-currency" class="currency-select" aria-label="From currency"></select>
        </div>
        <input
          id="from-amount"
          class="amount-input"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          spellcheck="false"
          aria-label="Amount to convert"
          placeholder="0"
          value="1"
        />
      </div>

      <div class="swap-wrap">
        <button
          type="button"
          id="swap-btn"
          class="swap-btn"
          aria-label="Swap from and to currencies"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 4v16" />
            <path d="M3 8l4-4 4 4" />
            <path d="M17 20V4" />
            <path d="M21 16l-4 4-4-4" />
          </svg>
        </button>
      </div>

      <div class="row" id="row-to">
        <div class="select-wrap">
          <label class="visually-hidden" for="to-currency">To currency</label>
          <select id="to-currency" class="currency-select" aria-label="To currency"></select>
        </div>
        <input
          id="to-amount"
          class="amount-input"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          spellcheck="false"
          aria-label="Converted amount"
          placeholder="0"
        />
      </div>
    </form>

    <div class="meta">
      <p class="rate" id="rate-line">
        <span class="rate-text" id="rate-text">Loading rates…</span>
        <button type="button" id="copy-btn" class="copy-btn" aria-live="polite">Copy</button>
      </p>
      <p class="updated" id="updated-line">Updated —</p>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    Rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">ExchangeRate-API</a>
  </footer>
</main>

<aside class="signature" aria-label="Attribution">Code by Oracule</aside>

  <script src="app.js" defer></script>
</body>
</html>
